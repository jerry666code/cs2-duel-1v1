name: Build AMBuild Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qy
          sudo apt-get install -y git clang binutils
          sudo apt-get install -y python3
          python3 -m pip install --upgrade pip importlib-metadata
          python3 -m pip install setuptools==45.2.0
          git clone https://github.com/alliedmodders/ambuild.git
          cd ambuild
          pip install .
          cd ..
          mkdir external
          cd external
          git clone --recursive --branch master --single-branch https://github.com/alliedmodders/metamod-source.git
          # Pin to a commit close to SchemaEntity's last update instead of tracking the
          # cs2 branch HEAD: SchemaEntity's schema headers (Ray_t, HitGroup_t,
          # NetworkStateChanged_t, etc.) don't track upstream hl2sdk-cs2 renames/refactors,
          # so building against the latest SDK breaks with undeclared-identifier errors.
          mkdir hl2sdk-cs2
          cd hl2sdk-cs2
          git init -q
          git remote add origin https://github.com/alliedmodders/hl2sdk.git
          git fetch --depth 1 origin 0c70f44f110e3eb7e2358af156d5bedfd7198ef0
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive
          cd ..
          cd ../..
          cd ${{ github.workspace }}

      - name: Configure and build plugin
        run: |
          mkdir build
          cd build
          python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize --hl2sdk-manifests=./hl2sdk-manifests --mms_path=$MMS_PATH --hl2sdk-root=$HL2SDK_ROOT
          ambuild

      - name: Create archive
        run: |
          cd build/package
          zip -r ${{ github.workspace }}.zip addons

      - name: Upload archive to artifact
        uses: actions/upload-artifact@v4
        with:
          name: compile
          path: ${{ github.workspace }}.zip
